name: pre_push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest4

    steps:
    - uses: actions/checkout@v4
    - name: formating
      run: cargo fmt --check
    - name: Run tests
      run: cargo test --verbose
