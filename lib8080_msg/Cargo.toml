[package]
name = "lib8080_msg"
authors = ["Cheese-Space"]
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "the internal library for the 8080_msg project"
readme = "README.md"
repository = "https://github.com/cheese-space/8080_msg"
keywords = ["messaging", "server", "client"]
categories = ["web-programming"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = {workspace = true}
tokio = {version = "1.53.0", default-features = false, features = ["io-util"], optional = true}

[features]
async = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]